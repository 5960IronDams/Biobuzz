# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 1 GB of RAM
org.gradle.jvmargs=-Xmx1024M

android.nonTransitiveRClass=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Pedro Pathing source toggle (pairs with build.gradle / build.dependencies.gradle).
# true  = use our locally-built fixed Pedro (com.pedropathing:*:pedroVersion from
#         mavenLocal; publish it via PedroPathing-MyWork's `gradlew deployLocal`).
# false = use upstream Pedro from Maven Central.
# Once upstream ships the fix, set this to false and bump pedroVersion to match.
useLocalPedro=true
pedroVersion=3.0.1