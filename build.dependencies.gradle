repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' }
    maven { url 'https://repo.dairy.foundation/releases/'}
    maven { url = "https://mymaven.bylazar.com/releases" }
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    // FTC Dashboard removed 2026-09-19: superseded by FTControl Panels
    // (core + plugins below). Panels provides telemetry, live-tuning
    // (@Configurable) and the Field widget; Dashboard's TelemetryPacket
    // field overlay + @Config are replaced by PanelsFieldRenderer.
    implementation 'com.pedropathing:revhub:3.0.1'
    // Pedro AutoTune (tuning procedures + Sloth). Gated by the pedroTuning
    // flag in gradle.properties: false = excluded (normal driving, Panels
    // @Configurable works); true = included (tuning sessions only).
    // com.pedropathing:tuning bundles Sloth, and Sloth duplicates classes,
    // which silently breaks Panels Configurables (Panels updates a different
    // copy of the statics than the OpModes use). After flipping the flag:
    // Sync + Rebuild. TeamCode/build.gradle also excludes
    // pedro/Tuning.java + pedro/procedures/* from compilation when false,
    // since those sources import com.pedropathing.tuning.*.
    def pedroTuningEnabled = (rootProject.findProperty('pedroTuning') ?: "false").toString().toBoolean()
    if (pedroTuningEnabled) {
        implementation 'com.pedropathing:tuning:1.0.1'
    }
    implementation 'com.pedropathing.ivy:pedro:1.1.1'
    // FTControl Panels, subset (2026-09-19): core + 10 plugins instead of
    // com.bylazar:fullpanels:1.0.13 (which bundles ~15 modules incl. Themes,
    // LimelightProxy, Docs, Lights, CameraStream). Smaller dex/assets = shorter
    // ClassManager scan = stays under the system ANR watchdog. Versions are
    // latest per https://mymaven.bylazar.com/releases as of 2026-09-19.
    implementation "com.bylazar:panels:1.0.5"
    implementation "com.bylazar:battery:1.0.3"
    implementation "com.bylazar:capture:1.0.3"
    implementation "com.bylazar:configurables:1.0.5"
    // NOTE field 1.0.7 AAR ships with no web assets so widget never shows; pinned to 1.0.6.
    implementation "com.bylazar:field:1.0.6"
    //implementation "com.bylazar:gamepad:1.0.4"
    implementation "com.bylazar:graph:1.0.4"
    implementation "com.bylazar:opmodecontrol:1.0.3"
    implementation "com.bylazar:pinger:1.0.3"
    implementation "com.bylazar:telemetry:1.0.5"
    implementation "com.bylazar:utils:1.0.4"
    implementation "com.bylazar:limelightproxy:1.0.4"
}
