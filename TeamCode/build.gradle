apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // Required by FTControl Panels (needs compileSdk 34+, minSdk 24).
    // Matches ftcontrol/Panels-Quickstart-Java TeamCode/build.gradle.
    compileSdk 34
    defaultConfig {
        minSdk 24
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // SolversLib core (command base, triggers, InterpolationMap).
    // 0.3.6 requires Pedro Pathing 3.0.0+ (we use com.pedropathing:revhub 3.x).
    // Repo (repo.dairy.foundation/releases) is in build.dependencies.gradle.
    // NOTE: FTCLib and SolversLib cannot coexist - do not add org.ftclib.ftclib:core.
    // Ivy commands (com.pedropathing.ivy.Command) are NOT SolversLib commands;
    // schedule Ivy commands from SolversLib triggers via runnables, e.g.
    //   gamepadEx.getGamepadButton(Button.A).onTrue(() -> CommandF.RunIntake().schedule());
    implementation 'org.solverslib:core:0.3.6'
}

// Pedro tuning toggle (pairs with the pedroTuning flag in gradle.properties
// and the conditional 'com.pedropathing:tuning' dep in build.dependencies.gradle).
// When false, exclude the AutoTune sources — pedro/Tuning.java +
// pedro/procedures/* — because they import com.pedropathing.tuning.*,
// which isn't on the classpath when tuning is off. Nothing else references
// them (Constants.java only mentions Tuning in a javadoc {@link}, which
// javac ignores), so match play / FusionTune / autos compile unchanged.
def pedroTuningEnabledTeamCode = (rootProject.findProperty('pedroTuning') ?: "false").toString().toBoolean()
if (!pedroTuningEnabledTeamCode) {
    android.sourceSets.main.java.exclude(
        'org/firstinspires/ftc/teamcode/pedro/Tuning.java',
        'org/firstinspires/ftc/teamcode/pedro/procedures/*.java'
    )
}
